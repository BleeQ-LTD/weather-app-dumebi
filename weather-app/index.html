<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
    <script>
      // Apply the saved theme before the page draws (see utils/themePreference.ts)
      (function () {
        var choice = null;
        try { choice = localStorage.getItem("weather-app-theme"); } catch (e) {}
        var light = choice === "light" ||
          (choice !== "dark" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
